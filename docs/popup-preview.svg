    <g transform="translate(16, 68)">
      <rect width="448" height="42" rx="12" fill="#0e0e0e" stroke="rgba(255,255,255,0.12)"/>
      <path d="M 16 21 L 22 15 M 16 21 L 22 27" stroke="#666666" stroke-width="1.8" stroke-linecap="round"/>
      <text x="32" y="26" fill="#cccccc" font-family="ui-monospace, monospace" font-size="11">https://www.tiktok.com/@femboymaggi/video/74829...</text>
      <rect x="372" y="8" width="68" height="26" rx="8" fill="#ffffff"/>
      <text x="388" y="25" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">FETCH</text>
