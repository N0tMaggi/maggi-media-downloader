      <rect x="24" y="22" width="3" height="24" fill="#ffffff"/>
      <rect x="30" y="26" width="3" height="20" fill="#ffffff"/>
      <rect x="36" y="20" width="3" height="26" fill="#ffffff"/>
      <rect x="42" y="30" width="3" height="16" fill="#ffffff"/>

