    <!-- Logo icon -->
    <rect x="16" y="13" width="28" height="28" rx="8" fill="#141414" stroke="rgba(255,255,255,0.2)"/>
    <path d="M 30 19 L 30 29 M 26 25 L 30 29 L 34 25" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Title & Tag -->
    <text x="52" y="31" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" letter-spacing="-0.01em">MAGGI DOWNLOADER</text>
    <rect x="206" y="18" width="46" height="18" rx="9" fill="rgba(255,255,255,0.08)"/>
    <text x="217" y="31" fill="#888888" font-family="ui-monospace, monospace" font-size="10" font-weight="600">v2.1</text>

    <!-- Sight status indicator -->
