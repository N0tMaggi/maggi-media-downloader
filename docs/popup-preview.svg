      <text x="16" y="66" fill="#555555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Provider: api.maggi.dev</text>
      <text x="362" y="66" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Preferences ⚙</text>
