      <text x="393" y="35" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700">VIDEO</text>
    </g>

    <!-- Main Player Deck -->
    <g transform="translate(16, 196)">
      <rect width="448" height="236" rx="14" fill="#0c0c0c" stroke="rgba(255,255,255,0.1)"/>
      
      <!-- Video Screen Mockup -->
