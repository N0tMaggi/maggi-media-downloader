<svg width="840" height="660" viewBox="0 0 840 660" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep Background -->
  <rect width="840" height="660" rx="20" fill="#050505"/>
  <rect x="2" y="2" width="836" height="656" rx="18" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Centered Settings Window Canvas -->
  <g transform="translate(60, 24)">
    <rect width="720" height="612" rx="18" fill="#000000" stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>

    <!-- Header -->
    <g transform="translate(24, 20)">
      <rect width="36" height="36" rx="10" fill="#111111" stroke="rgba(255,255,255,0.2)"/>
      <path d="M 18 12 L 18 24 M 14 20 L 18 24 L 22 20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="48" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">Maggi Media Downloader Settings</text>
      <rect x="308" y="8" width="50" height="18" rx="9" fill="rgba(255,255,255,0.08)"/>
      <text x="318" y="21" fill="#888888" font-family="ui-monospace, monospace" font-size="10" font-weight="600">v2.1.0</text>
      <text x="48" y="34" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Monochrome high-performance media extractor preferences</text>

      <rect x="560" y="6" width="112" height="26" rx="13" fill="#111111" stroke="rgba(255,255,255,0.12)"/>
      <circle cx="574" cy="19" r="4" fill="#ffffff"/>
      <text x="586" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="600">Engine Active</text>
    </g>

    <line x1="24" y1="74" x2="696" y2="74" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Platforms Section -->
    <g transform="translate(24, 88)">
      <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Supported Platforms</text>
      
      <g transform="translate(0, 26)">
        <rect width="326" height="44" rx="12" fill="#0d0d0d" stroke="rgba(255,255,255,0.1)"/>
        <text x="16" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">TikTok (Videos &amp; Photos)</text>
        <rect x="250" y="12" width="60" height="20" rx="6" fill="#ffffff"/>
        <text x="261" y="26" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="800">ACTIVE</text>
      </g>

      <g transform="translate(346, 26)">
        <rect width="326" height="44" rx="12" fill="#0d0d0d" stroke="rgba(255,255,255,0.1)"/>
        <text x="16" y="27" fill="#888888" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600">X / Twitter (Media Extractor)</text>
        <rect x="240" y="12" width="70" height="20" rx="6" fill="rgba(255,255,255,0.06)"/>
        <text x="249" y="26" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="700">UPCOMING</text>
      </g>
    </g>

    <!-- Filename Section -->
    <g transform="translate(24, 182)">
      <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">File Naming &amp; Appearance</text>

      <g transform="translate(0, 28)">
        <rect width="440" height="42" rx="12" fill="#0d0d0d" stroke="rgba(255,255,255,0.14)"/>
        <text x="14" y="26" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12">{author}-{id}-{type}</text>

        <!-- Token Pills -->
        <g transform="translate(0, 52)">
          <rect x="0" y="0" width="70" height="24" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
          <text x="10" y="16" fill="#888888" font-family="ui-monospace, monospace" font-size="11">+ {author}</text>

          <rect x="76" y="0" width="52" height="24" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
          <text x="86" y="16" fill="#888888" font-family="ui-monospace, monospace" font-size="11">+ {id}</text>

          <rect x="134" y="0" width="62" height="24" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
          <text x="144" y="16" fill="#888888" font-family="ui-monospace, monospace" font-size="11">+ {type}</text>

          <rect x="202" y="0" width="70" height="24" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
          <text x="212" y="16" fill="#888888" font-family="ui-monospace, monospace" font-size="11">+ {index}</text>

          <rect x="278" y="0" width="64" height="24" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
          <text x="288" y="16" fill="#888888" font-family="ui-monospace, monospace" font-size="11">+ {title}</text>
        </g>

        <!-- Preview Box -->
        <g transform="translate(0, 86)">
          <rect width="440" height="34" rx="8" fill="#080808" stroke="rgba(255,255,255,0.08)"/>
          <text x="12" y="22" fill="#666666" font-family="ui-monospace, monospace" font-size="10">PREVIEW:</text>
          <text x="80" y="22" fill="#ffffff" font-family="ui-monospace, monospace" font-size="11">@femboymaggi-7482910482910382910-video.mp4</text>
        </g>
      </g>

      <!-- Theme Select -->
      <g transform="translate(460, 28)">
        <rect width="212" height="42" rx="12" fill="#0d0d0d" stroke="rgba(255,255,255,0.14)"/>
        <text x="14" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Monochrome Dark</text>
        <path d="M 188 20 L 194 26 L 200 20" stroke="#888888" stroke-width="1.8" fill="none"/>
      </g>
    </g>

    <!-- In-Feed Injection & Options -->
    <g transform="translate(24, 342)">
      <text x="0" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700">Feed &amp; Download Preferences</text>

      <g transform="translate(0, 26)">
        <!-- Toggle 1 -->
        <rect width="326" height="52" rx="12" fill="#0d0d0d" stroke="rgba(255,255,255,0.1)"/>
        <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Auto-detect Active Video</text>
        <text x="14" y="40" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Instant scroll &amp; SPA tracking</text>
        <rect x="270" y="15" width="42" height="22" rx="11" fill="#ffffff"/>
        <circle cx="298" cy="26" r="8" fill="#000000"/>

        <!-- Toggle 2 -->
        <g transform="translate(346, 0)">
          <rect width="326" height="52" rx="12" fill="#0d0d0d" stroke="rgba(255,255,255,0.1)"/>
          <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">In-Feed Download Button</text>
          <text x="14" y="40" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Native action button on feed rails</text>
          <rect x="270" y="15" width="42" height="22" rx="11" fill="#ffffff"/>
          <circle cx="298" cy="26" r="8" fill="#000000"/>
        </g>
      </g>

      <g transform="translate(0, 88)">
        <!-- Toggle 3 -->
        <rect width="326" height="52" rx="12" fill="#0d0d0d" stroke="rgba(255,255,255,0.1)"/>
        <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Save Dialog for Videos</text>
        <text x="14" y="40" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Prompt location for .mp4</text>
        <rect x="270" y="15" width="42" height="22" rx="11" fill="#ffffff"/>
        <circle cx="298" cy="26" r="8" fill="#000000"/>

        <!-- Toggle 4 -->
        <g transform="translate(346, 0)">
          <rect width="326" height="52" rx="12" fill="#0d0d0d" stroke="rgba(255,255,255,0.1)"/>
          <text x="14" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Save Dialog for Audio</text>
          <text x="14" y="40" fill="#666666" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11">Prompt location for .mp3</text>
          <rect x="270" y="15" width="42" height="22" rx="11" fill="#ffffff"/>
          <circle cx="298" cy="26" r="8" fill="#000000"/>
        </g>
      </g>
    </g>

    <!-- Sticky Bottom Bar -->
    <g transform="translate(24, 532)">
      <rect width="672" height="60" rx="14" fill="#0e0e0e" stroke="rgba(255,255,255,0.14)"/>
      <polyline points="24 30 28 34 36 26" stroke="#4ade80" stroke-width="2" fill="none"/>
      <text x="44" y="34" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Preferences saved successfully.</text>

      <rect x="420" y="12" width="104" height="36" rx="10" fill="transparent" stroke="rgba(255,255,255,0.14)"/>
      <text x="472" y="35" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">Reset Defaults</text>

      <rect x="536" y="12" width="124" height="36" rx="10" fill="#ffffff"/>
      <text x="598" y="35" text-anchor="middle" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700">Save Preferences</text>
    </g>
  </g>
</svg>
